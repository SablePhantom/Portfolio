    <h2>Damage Check</h2>
    <button onclick="dmgCheck()">Begin</button>

        <p id="demo"></p>

        <script>
        function dmgCheck() {
        let text;
        let option = prompt("Is the car damaged?", "No");
        if (option == null || option == "") {
            text = "Damage not confirmed.";
        }   else if (option == "No" || option == "no"){
            text = "Car is not damaged! No additional fees apply.";
        }   else if (option == "Yes" || option == "yes"){
            text = "Car has damage! Additional fees will apply.";
        }   else {
            text = "Damage not confirmed.";
        }

        document.getElementById("demo").innerHTML = text;
        }
</script>
